# Deploy console.zexvro.in (Cloudflare Pages project `zexvro`) on every main push.
#
# Required repo secret (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN  — Account API token with:
#     Account → Cloudflare Pages → Edit
#     Account → Account Settings → Read (optional; helps wrangler resolve account)
#
# Optional secrets / vars (override production defaults):
#   CLOUDFLARE_ACCOUNT_ID   secret or var (default below)
#   VITE_API_URL, VITE_NFT_API_URL, VITE_DEPIN_API_URL, VITE_AGENT_AUTH_API_URL
#
# Manual full stack (Lambda + Dynamo + Pages) remains:
#   ./scripts/deploy-production.sh
name: Deploy console (Cloudflare Pages)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-console-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build + wrangler pages deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Public Cloudflare account id for ZEXVRO (not a secret).
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || 'ac51c31a2a40b154a68a40bd5283fae2' }}
      # Same production defaults as scripts/deploy-production.sh
      VITE_API_URL: ${{ vars.VITE_API_URL || 'https://qkuostruh3.execute-api.us-east-1.amazonaws.com' }}
      VITE_APP_URL: ${{ vars.VITE_APP_URL || 'https://console.zexvro.in' }}
      VITE_NFT_API_URL: ${{ vars.VITE_NFT_API_URL || 'https://iyk6idmup6.us-east-1.awsapprunner.com' }}
      VITE_DEPIN_API_URL: ${{ vars.VITE_DEPIN_API_URL || 'https://sr9k3xpmbj.us-east-1.awsapprunner.com' }}
      VITE_AGENT_AUTH_API_URL: ${{ vars.VITE_AGENT_AUTH_API_URL || 'https://api.zexvro.in/gate' }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'zexvro' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend (production)
        working-directory: frontend
        run: |
          set -euo pipefail
          echo "VITE_API_URL=$VITE_API_URL"
          echo "VITE_APP_URL=$VITE_APP_URL"
          echo "VITE_NFT_API_URL=$VITE_NFT_API_URL"
          echo "VITE_DEPIN_API_URL=$VITE_DEPIN_API_URL"
          echo "VITE_AGENT_AUTH_API_URL=$VITE_AGENT_AUTH_API_URL"
          npm run build

      - name: Require Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing repo secret CLOUDFLARE_API_TOKEN. Create a Cloudflare API token with Pages Edit and add it under Settings → Secrets → Actions."
            exit 1
          fi

      - name: Deploy Cloudflare Pages
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$CF_PAGES_PROJECT" \
            --branch=main \
            --commit-dirty=true

      - name: Smoke console
        run: |
          set -euo pipefail
          # Custom domain can lag a few seconds behind Pages deploy.
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://console.zexvro.in/" || true)
            echo "console.zexvro.in attempt $i → $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::warning::console.zexvro.in did not return 200 after deploy (last=$code). Check Pages dashboard / DNS."
          exit 0
