    <!-- Default canonical; route-aware script below swaps it for /services -->
    <link rel="canonical" href="https://zexvro.in/" />
    <link rel="alternate" hreflang="en" href="https://zexvro.in/" />
    <link rel="alternate" hreflang="x-default" href="https://zexvro.in/" />

    <!-- Route-aware canonical + OG url: SPA serves /services from this file -->
    <script>
      (function () {
        try {
          var path = window.location.pathname.replace(/\/$/, '') || '/';
          var url = 'https://zexvro.in' + (path === '/' ? '/' : path) + '/';
          var isServices = path === '/services';
          var can = document.querySelector('link[rel="canonical"]');
          if (can) {
            can.href = url;
          } else {
            can = document.createElement('link');
            can.rel = 'canonical';
            can.href = url;
            document.head.appendChild(can);
          }
          document.querySelectorAll('meta[property="og:url"]').forEach(function (m) {
            m.setAttribute('content', url);
          });
          if (isServices) {
            document.title =
              'ZEXVRO Service Catalog — Zer0, Morph, REQWID, NFTo & DEDSEC';
            var d = document.querySelector('meta[name="description"]');
            if (!d) {
              d = document.createElement('meta');
              d.name = 'description';
              document.head.appendChild(d);
            }
            d.content =
              'The full ZEXVRO service catalog: what each service does, who it is for, and why teams use it — Zer0, Morph, REQWID, NFTo, DEDSEC, and ZEXVRO Labs.';
          }
        } catch (e) {}
      })();
    </script>
